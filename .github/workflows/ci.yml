name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: swift build + test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || true
          swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build (all targets)
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build --parallel

  linux:
    name: swift test (Linux, MergeCore + CLI)
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: SQLite headers
        run: apt-get update -q && apt-get install -y -q libsqlite3-dev
      - name: Test
        run: swift test --parallel
